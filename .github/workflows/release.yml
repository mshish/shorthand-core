# Adapted from the official obsidianmd/obsidian-sample-plugin release workflow, which
# deliberately uses no third-party release action — just checkout, a runtime setup action,
# actions/attest, and the gh CLI. Two adaptations: Bun instead of Node/npm (this repo has
# bun.lock and no package-lock.json), and the build artifacts live in plugin/ rather than
# at the repo root.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately: a Bun upgrade can change install/build behaviour between
          # releases, and this is the version the test suite is verified against.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(jq -r .version plugin/manifest.json)"
          if [ "${tag#v}" != "$manifest" ]; then
            echo "Tag ${tag} does not match plugin/manifest.json version ${manifest}." >&2
            echo "Obsidian installs by manifest version, so a mismatch ships a broken release." >&2
            exit 1
          fi

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun test

      - name: Build plugin
        run: bun run build:plugin

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: plugin/main.js

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            plugin/main.js plugin/manifest.json
