# Adapted from the official obsidianmd/obsidian-sample-plugin release workflow, which
# deliberately uses no third-party release action — just checkout, a runtime setup action,
# actions/attest, and the gh CLI. Two adaptations: Bun instead of Node/npm (this repo has
# bun.lock and no package-lock.json), and the build artifacts live in plugin/ rather than
# at the repo root.
name: Release Obsidian plugin

# Scoped by tag SHAPE, not by prefix. BRAT and Obsidian's community listing both require the
# release tag to EQUAL the manifest version with no prefix — BRAT treats the tag as the source
# of truth and overrides the manifest on a mismatch — so a prefixed scheme silently breaks both.
# A bare-version glob still excludes a sibling tool's tag (`apisink-v0.1.0` does not match),
# which is the property the prefix was there to provide.
on:
  push:
    # Glob, not regex: `+` is a literal here, so quantifiers do not work. `[0-9]*` is the
    # correct shape filter. The guard below still enforces exact tag == manifest equality.
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately: a Bun upgrade can change install/build behaviour between
          # releases, and this is the version the test suite is verified against.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(jq -r .version plugin/manifest.json)"
          # Exact equality, no prefix stripping: BRAT requires tag == release name == manifest
          # version, and overrides the manifest with the tag when they differ.
          if [ "$tag" != "$manifest" ]; then
            echo "Tag ${tag} does not match plugin/manifest.json version ${manifest}." >&2
            echo "Expected tag ${manifest}." >&2
            echo "BRAT and Obsidian both install by manifest version, and BRAT treats the tag" >&2
            echo "as the source of truth — a mismatch ships a plugin reporting the wrong version." >&2
            exit 1
          fi
          # versions.json maps plugin version -> minAppVersion so an older Obsidian can resolve
          # the newest build it can actually run. Obsidian reads it from the repo's default
          # branch, so it is inert while this repo is private — but a missing entry only shows
          # up the day the repo goes public, long after the release it describes. Check it now.
          if [ "$(jq -r --arg v "$tag" '.[$v] // "missing"' plugin/versions.json)" = "missing" ]; then
            echo "plugin/versions.json has no entry for ${tag}." >&2
            echo "Run \"bun run version:bump ${tag}\" and commit before tagging." >&2
            exit 1
          fi

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun test

      - name: Build plugin
        run: bun run build:plugin

      # Build provenance is unavailable on user-owned PRIVATE repositories — the API rejects it
      # with "Feature not available for user-owned private repositories". Skipping rather than
      # failing keeps releases working while private, and attestation resumes on its own if the
      # repository is ever made public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: plugin/main.js

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            plugin/main.js plugin/manifest.json
